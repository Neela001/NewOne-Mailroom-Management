<div class="dialog-header">
  <div class="dialog-header-row">
    <h2 class="dialog-title">Change Password</h2>
    <app-button variant="secondary" icon="close" [iconOnly]="true" type="button" (click)="close()">Close</app-button>
  </div>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" (keydown.enter)="onEnterKey($event)">
  <div class="dialog-content">
    <div class="form-content">
      <app-input
        label="Current Password"
        type="password"
        [revealable]="true"
        autocomplete="current-password"
        formControlName="currentPassword"
        [required]="true"
        [invalid]="!!(form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched)"
        errorText="Current password is required"
      />
      <app-input
        label="New Password"
        type="password"
        [revealable]="true"
        autocomplete="new-password"
        formControlName="newPassword"
        [required]="true"
        [invalid]="!!(form.get('newPassword')?.invalid && form.get('newPassword')?.touched)"
        errorText="New password must be at least 6 characters"
      />
      <app-input
        label="Confirm New Password"
        type="password"
        [revealable]="true"
        autocomplete="new-password"
        formControlName="confirmPassword"
        [required]="true"
        [invalid]="!!(form.hasError('mismatch') && form.get('confirmPassword')?.touched)"
        errorText="Passwords do not match"
      />
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }
  </div>

  <div class="dialog-footer">
    <app-button variant="secondary" icon="cancel" type="button" (click)="close()" [disabled]="saving()">Close</app-button>
    <app-button variant="navy" icon="save" type="submit" [loading]="saving()" [disabled]="saving()">Save</app-button>
  </div>
</form>
