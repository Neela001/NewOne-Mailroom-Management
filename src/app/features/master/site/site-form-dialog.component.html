<div class="dialog-header">
  <div class="dialog-header-row">
    <div>
      <h2 class="dialog-title">{{ isEdit ? 'Edit Site' : 'Add Site' }}</h2>
      <p class="dialog-subtitle">Select the location and enter the Site Code and Site Name.</p>
    </div>
    <app-button variant="secondary" icon="close" [iconOnly]="true" type="button" (click)="onCancelClick()">Close</app-button>
  </div>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" (keydown.enter)="onEnterKey($event)">
  <div class="dialog-content">
    <div class="site-form-panel">
      <div class="form-row">
        <app-combobox
          class="col-half"
          label="Country"
          [required]="true"
          [options]="countryOptions()"
          [loading]="countriesLoading()"
          [error]="countriesError()"
          formControlName="countryId"
          placeholder="Select a country…"
          noResultsText="No active countries found."
          [invalid]="!!(form.get('countryId')?.invalid && form.get('countryId')?.touched)"
          errorText="Country is required"
        />
        <app-combobox
          class="col-half"
          [label]="stateLabel()"
          [options]="stateOptions()"
          [loading]="statesLoading()"
          [error]="statesError()"
          formControlName="stateId"
          placeholder="Select a state…"
          noResultsText="No active states found for this country."
        />
      </div>

      <div class="form-row">
        <app-combobox
          class="col-half"
          [label]="cityLabel()"
          [options]="cityOptions()"
          [loading]="citiesLoading()"
          [error]="citiesError()"
          formControlName="cityId"
          placeholder="Select a city…"
          noResultsText="No active cities found for this location."
        />
        <app-combobox
          class="col-half"
          [label]="postalCodeLabel()"
          [options]="postalCodeOptions()"
          [loading]="postalCodesLoading()"
          [error]="postalCodesError()"
          formControlName="postalCodeId"
          placeholder="Select a postal code…"
          noResultsText="No active postal codes found for this location."
        />
      </div>

      <div class="form-row">
        <app-combobox
          class="col-half"
          [label]="areaLabel()"
          [options]="areaOptions()"
          [loading]="areasLoading()"
          [error]="areasError()"
          formControlName="areaId"
          placeholder="Select an area…"
          noResultsText="No active areas found for this location."
        />
        <app-input
          class="col-half"
          label="Site Code"
          [required]="true"
          formControlName="siteCode"
          [invalid]="!!(form.get('siteCode')?.invalid && form.get('siteCode')?.touched)"
          errorText="Site Code is required"
        />
      </div>

      <div class="form-row">
        <app-input
          class="col-full"
          label="Site Name"
          [required]="true"
          formControlName="siteName"
          [invalid]="!!(form.get('siteName')?.invalid && form.get('siteName')?.touched)"
          errorText="Site Name is required"
        />
      </div>

      <div class="form-row">
        <app-textarea class="col-full" label="Remarks" formControlName="remarks" />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }
  </div>

  <div class="dialog-footer">
    <div class="required-hint">
      <p>* Required fields</p>
      <p>Select Country and enter Site Code and Site Name; other location levels are optional.</p>
    </div>
    <div class="dialog-footer-actions">
      <app-button variant="secondary" icon="cancel" type="button" (click)="onCancelClick()" [disabled]="saving()">Cancel</app-button>
      <app-button variant="navy" icon="save" type="submit" [loading]="saving()" [disabled]="saving()">Save Site</app-button>
    </div>
  </div>
</form>
