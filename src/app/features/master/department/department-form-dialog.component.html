<div class="dialog-header">
  <div class="dialog-header-row">
    <div>
      <h2 class="dialog-title">{{ isEdit ? 'Edit Department' : 'Add Department' }}</h2>
      <p class="dialog-subtitle">Select Company and Division, then enter Department details.</p>
    </div>
    <app-button variant="secondary" icon="close" [iconOnly]="true" type="button" (click)="onCancelClick()">Close</app-button>
  </div>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" (keydown.enter)="onEnterKey($event)">
  <div class="dialog-content">
    <div class="department-form-panel">
      <div class="form-row">
        <app-combobox
          class="col-half"
          label="Company"
          [required]="true"
          [options]="companyOptions()"
          [loading]="companiesLoading()"
          [error]="companiesError()"
          formControlName="companyId"
          placeholder="Select a company…"
          noResultsText="No active companies found."
          [invalid]="!!(form.get('companyId')?.invalid && form.get('companyId')?.touched)"
          errorText="Company is required"
        />
        <app-combobox
          class="col-half"
          label="Division"
          [required]="true"
          [options]="divisionOptions()"
          [loading]="divisionsLoading()"
          [error]="divisionsError()"
          formControlName="divisionId"
          placeholder="Select a division…"
          noResultsText="No active divisions found for this company."
          [invalid]="!!(form.get('divisionId')?.invalid && form.get('divisionId')?.touched)"
          errorText="Division is required"
        />
      </div>

      <div class="form-row">
        <app-input
          class="col-half"
          label="Department Code"
          [required]="true"
          formControlName="departmentCode"
          [invalid]="!!(form.get('departmentCode')?.invalid && form.get('departmentCode')?.touched)"
          errorText="Department Code is required"
        />
        <app-input
          class="col-half"
          label="Department Name"
          [required]="true"
          formControlName="departmentName"
          [invalid]="!!(form.get('departmentName')?.invalid && form.get('departmentName')?.touched)"
          errorText="Department Name is required"
        />
      </div>

      <div class="form-row">
        <app-textarea class="col-full" label="Remarks" formControlName="remarks" />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }
  </div>

  <div class="dialog-footer">
    <div class="required-hint">
      <p>* Required fields</p>
      <p>{{ helperText() }}</p>
    </div>
    <div class="dialog-footer-actions">
      <app-button variant="secondary" icon="cancel" type="button" (click)="onCancelClick()" [disabled]="saving()">Cancel</app-button>
      <app-button variant="navy" icon="save" type="submit" [loading]="saving()" [disabled]="saving()">{{ isEdit ? 'Update Department' : 'Save Department' }}</app-button>
    </div>
  </div>
</form>
