<div class="dialog-header">
  <div class="dialog-header-row">
    <div>
      <h2 class="dialog-title">{{ isEdit ? 'Edit Cost Center' : 'Add Cost Center' }}</h2>
      <p class="dialog-subtitle">Select Company, then enter the Cost Center details.</p>
    </div>
    <app-button variant="secondary" icon="close" [iconOnly]="true" type="button" (click)="onCancelClick()">Close</app-button>
  </div>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" (keydown.enter)="onEnterKey($event)">
  <div class="dialog-content">
    <div class="costcenter-form-panel">
      <div class="form-row">
        <app-combobox
          class="col-full"
          label="Company"
          [required]="true"
          [options]="companyOptions()"
          [loading]="companiesLoading()"
          [error]="companiesError()"
          formControlName="companyId"
          placeholder="Select a company…"
          noResultsText="No active companies found."
          [invalid]="!!(form.get('companyId')?.invalid && form.get('companyId')?.touched)"
          errorText="Company is required"
        />
      </div>

      <div class="form-row">
        <app-input
          class="col-half"
          label="Cost Center Code"
          [required]="true"
          formControlName="costCenterCode"
          [invalid]="!!(form.get('costCenterCode')?.invalid && form.get('costCenterCode')?.touched)"
          errorText="Cost Center Code is required"
        />
        <app-input
          class="col-half"
          label="Cost Center Name"
          [required]="true"
          formControlName="costCenterName"
          [invalid]="!!(form.get('costCenterName')?.invalid && form.get('costCenterName')?.touched)"
          errorText="Cost Center Name is required"
        />
      </div>

      <div class="form-row">
        <app-textarea class="col-full" label="Remarks" formControlName="remarks" />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }
  </div>

  <div class="dialog-footer">
    <div class="required-hint">
      <p>* Required fields</p>
      <p>{{ helperText() }}</p>
    </div>
    <div class="dialog-footer-actions">
      <app-button variant="secondary" icon="cancel" type="button" (click)="onCancelClick()" [disabled]="saving()">Cancel</app-button>
      <app-button variant="navy" icon="save" type="submit" [loading]="saving()" [disabled]="saving()">{{ isEdit ? 'Update Cost Center' : 'Save Cost Center' }}</app-button>
    </div>
  </div>
</form>
