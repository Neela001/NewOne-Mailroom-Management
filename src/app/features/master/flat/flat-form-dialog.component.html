<div class="dialog-header">
  <div class="dialog-header-row">
    <div>
      <h2 class="dialog-title">{{ isEdit ? 'Edit Flat' : 'Add Flat' }}</h2>
      <p class="dialog-subtitle">Select the location, then enter the Flat details.</p>
    </div>
    <app-button variant="secondary" icon="close" [iconOnly]="true" type="button" (click)="onCancelClick()">Close</app-button>
  </div>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" (keydown.enter)="onEnterKey($event)">
  <div class="dialog-content">
    <div class="flat-form-panel">
      <div class="form-row">
        <app-combobox
          class="col-half"
          label="Site"
          [required]="true"
          [options]="siteOptions()"
          [loading]="sitesLoading()"
          [error]="sitesError()"
          formControlName="siteId"
          placeholder="Select a site…"
          noResultsText="No active sites found."
          [invalid]="!!(form.get('siteId')?.invalid && form.get('siteId')?.touched)"
          errorText="Site is required"
        />
        <app-combobox
          class="col-half"
          label="Building"
          [required]="true"
          [options]="buildingOptions()"
          [loading]="buildingsLoading()"
          [error]="buildingsError()"
          formControlName="buildingId"
          placeholder="Select a building…"
          noResultsText="No active RESIDENTIAL buildings found for this site."
          [invalid]="!!(form.get('buildingId')?.invalid && form.get('buildingId')?.touched)"
          errorText="Building is required"
        />
      </div>

      <div class="form-row">
        <app-combobox
          class="col-half"
          label="Floor"
          [required]="true"
          [options]="floorOptions()"
          [loading]="floorsLoading()"
          [error]="floorsError()"
          formControlName="floorId"
          placeholder="Select a floor…"
          noResultsText="No active floors found for this building."
          [invalid]="!!(form.get('floorId')?.invalid && form.get('floorId')?.touched)"
          errorText="Floor is required"
        />
        <app-combobox
          class="col-half"
          label="Wing"
          [required]="true"
          [options]="wingOptions()"
          [loading]="wingsLoading()"
          [error]="wingsError()"
          formControlName="wingId"
          placeholder="Select a wing…"
          noResultsText="No active wings found for this floor."
          [invalid]="!!(form.get('wingId')?.invalid && form.get('wingId')?.touched)"
          errorText="Wing is required"
        />
      </div>

      <div class="form-row form-row--flat-fields">
        <app-input
          class="col-flat-code"
          label="Flat Code"
          [required]="true"
          formControlName="flatCode"
          [invalid]="!!(form.get('flatCode')?.invalid && form.get('flatCode')?.touched)"
          errorText="Flat Code is required"
        />
        <app-input
          class="col-flat-number"
          label="Flat Number"
          [required]="true"
          formControlName="flatNumber"
          [invalid]="!!(form.get('flatNumber')?.invalid && form.get('flatNumber')?.touched)"
          errorText="Flat Number is required"
        />
        <app-input
          class="col-flat-name"
          label="Flat Name"
          [required]="true"
          formControlName="flatName"
          [invalid]="!!(form.get('flatName')?.invalid && form.get('flatName')?.touched)"
          errorText="Flat Name is required"
        />
      </div>

      <div class="form-row">
        <app-textarea class="col-full" label="Remarks" formControlName="remarks" />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }
  </div>

  <div class="dialog-footer">
    <div class="required-hint">
      <p>* Required fields</p>
      <p>Only active RESIDENTIAL buildings can have Flats.</p>
    </div>
    <div class="dialog-footer-actions">
      <app-button variant="secondary" icon="cancel" type="button" (click)="onCancelClick()" [disabled]="saving()">Cancel</app-button>
      <app-button variant="navy" icon="save" type="submit" [loading]="saving()" [disabled]="saving()">{{ isEdit ? 'Update Flat' : 'Save Flat' }}</app-button>
    </div>
  </div>
</form>
