<div class="dialog-header">
  <div class="dialog-header-row">
    <div>
      <h2 class="dialog-title">{{ isEdit ? 'Edit Floor' : 'Add Floor' }}</h2>
      <p class="dialog-subtitle">Choose a Site and Building, then enter the Floor details.</p>
    </div>
    <app-button variant="secondary" icon="close" [iconOnly]="true" type="button" (click)="onCancelClick()">Close</app-button>
  </div>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" (keydown.enter)="onEnterKey($event)">
  <div class="dialog-content">
    <div class="floor-form-panel">
      <div class="form-row">
        <app-combobox
          class="col-half"
          label="Site"
          [required]="true"
          [options]="siteOptions()"
          [loading]="sitesLoading()"
          [error]="sitesError()"
          formControlName="siteId"
          placeholder="Select a site…"
          noResultsText="No active sites found."
          [invalid]="!!(form.get('siteId')?.invalid && form.get('siteId')?.touched)"
          errorText="Site is required"
        />
        <app-combobox
          class="col-half"
          label="Building"
          [required]="true"
          [options]="buildingOptions()"
          [loading]="buildingsLoading()"
          [error]="buildingsError()"
          formControlName="buildingId"
          placeholder="Select a building…"
          noResultsText="No active buildings found for this site."
          [invalid]="!!(form.get('buildingId')?.invalid && form.get('buildingId')?.touched)"
          errorText="Building is required"
        />
      </div>

      <div class="form-row">
        <app-input
          class="col-half"
          label="Floor Code"
          [required]="true"
          formControlName="floorCode"
          [invalid]="!!(form.get('floorCode')?.invalid && form.get('floorCode')?.touched)"
          errorText="Floor Code is required"
        />
        <app-input
          class="col-half"
          label="Floor Name"
          [required]="true"
          formControlName="floorName"
          [invalid]="!!(form.get('floorName')?.invalid && form.get('floorName')?.touched)"
          errorText="Floor Name is required"
        />
      </div>

      <div class="form-row">
        <app-input class="col-half" label="Floor Number" type="number" placeholder="e.g. -1, 0, 1" formControlName="floorNumber" />
      </div>

      <div class="form-row">
        <app-textarea class="col-full" label="Remarks" formControlName="remarks" />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }
  </div>

  <div class="dialog-footer">
    <div class="required-hint">
      <p>* Required fields</p>
      <p>Select Site and Building, then enter Floor details.</p>
    </div>
    <div class="dialog-footer-actions">
      <app-button variant="secondary" icon="cancel" type="button" (click)="onCancelClick()" [disabled]="saving()">Cancel</app-button>
      <app-button variant="navy" icon="save" type="submit" [loading]="saving()" [disabled]="saving()">{{ isEdit ? 'Update Floor' : 'Save Floor' }}</app-button>
    </div>
  </div>
</form>
