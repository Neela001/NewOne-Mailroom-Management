<div class="dialog-header">
  <div class="dialog-header-row">
    <div>
      <h2 class="dialog-title">{{ isEdit ? 'Edit Division' : 'Add Division' }}</h2>
      <p class="dialog-subtitle">Select Company, then enter the Division details.</p>
    </div>
    <app-button variant="secondary" icon="close" [iconOnly]="true" type="button" (click)="onCancelClick()">Close</app-button>
  </div>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" (keydown.enter)="onEnterKey($event)">
  <div class="dialog-content">
    <div class="division-form-panel">
      <div class="form-row">
        <app-combobox
          class="col-full"
          label="Company"
          [required]="true"
          [options]="companyOptions()"
          [loading]="companiesLoading()"
          [error]="companiesError()"
          formControlName="companyId"
          placeholder="Select a company…"
          noResultsText="No active companies found."
          [invalid]="!!(form.get('companyId')?.invalid && form.get('companyId')?.touched)"
          errorText="Company is required"
        />
      </div>

      <div class="form-row">
        <app-input
          class="col-half"
          label="Division Code"
          [required]="true"
          formControlName="divisionCode"
          [invalid]="!!(form.get('divisionCode')?.invalid && form.get('divisionCode')?.touched)"
          errorText="Division Code is required"
        />
        <app-input
          class="col-half"
          label="Division Name"
          [required]="true"
          formControlName="divisionName"
          [invalid]="!!(form.get('divisionName')?.invalid && form.get('divisionName')?.touched)"
          errorText="Division Name is required"
        />
      </div>

      <div class="form-row">
        <app-textarea class="col-full" label="Remarks" formControlName="remarks" />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }
  </div>

  <div class="dialog-footer">
    <div class="required-hint">
      <p>* Required fields</p>
      <p>{{ saving() ? 'Saving…' : 'Ready' }}</p>
    </div>
    <div class="dialog-footer-actions">
      <app-button variant="secondary" icon="cancel" type="button" (click)="onCancelClick()" [disabled]="saving()">Cancel</app-button>
      <app-button variant="navy" icon="save" type="submit" [loading]="saving()" [disabled]="saving()">{{ isEdit ? 'Update Division' : 'Save Division' }}</app-button>
    </div>
  </div>
</form>
