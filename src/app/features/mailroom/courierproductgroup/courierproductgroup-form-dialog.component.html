<div class="dialog-header">
  <div class="dialog-header-row">
    <div>
      <h2 class="dialog-title">{{ isEdit ? 'Edit Courier Product Group' : 'Add Courier Product Group' }}</h2>
      <p class="dialog-subtitle">{{ helperText }}</p>
    </div>
    <app-button variant="secondary" icon="close" [iconOnly]="true" type="button" (click)="onCancelClick()">Close</app-button>
  </div>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" (keydown.enter)="onEnterKey($event)">
  <div class="dialog-content">
    <div class="courierproductgroup-form-panel">
      <div class="form-row">
        <app-input
          class="col-full"
          label="Code"
          [required]="true"
          formControlName="code"
          [invalid]="!!(form.get('code')?.invalid && form.get('code')?.touched)"
          errorText="Code is required"
        />
      </div>

      <div class="form-row">
        <app-input
          class="col-full"
          label="Name"
          [required]="true"
          formControlName="name"
          [invalid]="!!(form.get('name')?.invalid && form.get('name')?.touched)"
          errorText="Name is required"
        />
      </div>

      <div class="form-row">
        <app-textarea class="col-full" label="Change remarks" formControlName="remarks" />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }
  </div>

  <div class="dialog-footer">
    <div class="required-hint">
      <p>* Required fields</p>
      <p>{{ helperText }}</p>
    </div>
    <div class="dialog-footer-actions">
      <app-button variant="secondary" icon="cancel" type="button" (click)="onCancelClick()" [disabled]="saving()">Cancel</app-button>
      <app-button variant="navy" icon="save" type="submit" [loading]="saving()" [disabled]="saving()">{{ isEdit ? 'Update group' : 'Save group' }}</app-button>
    </div>
  </div>
</form>
