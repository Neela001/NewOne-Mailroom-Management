<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NewOne</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Inter — this app's own functional typography (body text, table
         data, forms, nav) across the whole redesigned interface. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Fraunces — the display/editorial serif used ONLY for page titles,
         dialog titles, and the brand wordmark (never body text or table
         data) — see tailwind.css's own --font-serif comment for why. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- Material Symbols Outlined — the sidebar/topbar's own icon family
         (see menu-tree-item.component.scss's own comment): a thinner,
         more refined outlined stroke than the classic filled Material
         Icons font above, which the rest of the app's buttons/dialogs keep
         using. Confirmed against the real backend's own iconName values
         (admin/user-rights/me) that every properly-named icon this app
         actually uses exists identically in both families — only the
         style changes, never the glyph a name maps to. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
